summary = """
入力は公式サイトの画像（1120×440、1枚あたり幅 516px）です。8個は差分マップではっきり出て、左右・重ね合わせの拡大でも確認できました。
#9（女の人の後ろの白い枠）は、初版では「右の絵の歪み」と判断して除外していました。行ごとに位置を測ると、枠線は左右で約8pxずれているのに、すぐ隣の青い円の輪郭は1px しかずれていません。枠の形そのものが描き変えられていると判断を改めました。公式画像なので歪みはほぼないはずで、左下の枠の周りのずれも同じ #9 の一部として数えています。
#10（トラックのいちばん後ろの青いしま）は、差分マップでは周りのノイズと同じ程度の弱い反応で、候補の閾値を下げても上位に出ませんでした。そこで、しまの縁の位置を行ごとにサブピクセルで測りました。右の絵ではこのしまの前側の縁だけが1.0〜1.9px 前に出ていて、後ろ側の縁や他のしまの縁は±0.5px 以内で一致していました。片側の縁だけが同じ向きにずれ続けているので、しまが太く描き変えられていると判断しました。差分マップの弱い反応は、ユーザーから指摘されて見直したものです。
"""

